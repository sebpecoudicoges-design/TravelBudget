name: Capture synthetic Android store screenshots
on:
  push:
    branches: ['codex/play-screenshots-10.5.397']
    paths: ['.github/workflows/android-play-screenshots.yml', 'scripts/capture-play-screenshots.mjs']

permissions:
  contents: read

concurrency:
  group: play-screenshots-10.5.397
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check workflow branch and source baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/play-screenshots-10.5.397
          release=2a85d8941df4a18d780236ae49eccc323759f44f
          git merge-base --is-ancestor "$release" HEAD
          git diff --exit-code "$release" HEAD -- . ':!.github/workflows/android-play-screenshots.yml' ':!scripts/capture-play-screenshots.mjs'
          test "$(node -p 'require("./package.json").version')" = 10.5.397
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Preflight PNG formatting and OCR
        run: |
          set -euo pipefail
          if ! command -v tesseract >/dev/null || ! tesseract --list-langs 2>/dev/null | grep -Fx fra; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
          fi
          tesseract --list-langs | grep -Fx fra
          img_python=$(command -v python3)
          if ! "$img_python" -c 'from PIL import Image'; then
            python3 -m venv "$RUNNER_TEMP/play-image-venv"
            img_python="$RUNNER_TEMP/play-image-venv/bin/python"
            "$img_python" -m pip --disable-pip-version-check install pillow==11.3.0
          fi
          "$img_python" -c 'from PIL import Image; assert Image.new("RGBA",(1,1)).convert("RGB").mode == "RGB"'
          echo "PLAY_IMAGE_PYTHON=$img_python" >> "$GITHUB_ENV"
      - name: Build from exact release source
        run: |
          set -euo pipefail
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          "$sdk" --install "platforms;android-36" "build-tools;36.0.0"
          npm ci
          npm run build
          node scripts/capture-play-screenshots.mjs --prepare-fixture
          npx --no-install cap sync android
          # Apply software drawing solely to the transient debug capture APK.
          # Capture task's source baseline check above forbids any app-source edits.
          activity=android/app/src/main/java/com/travelbudget/app/MainActivity.java
          grep -F 'super.onCreate(savedInstanceState);' "$activity"
          sed -i '/super.onCreate(savedInstanceState);/a\        if (getBridge() != null) getBridge().getWebView().setLayerType(android.view.View.LAYER_TYPE_SOFTWARE, null);' "$activity"
          (cd android && bash ./gradlew --no-daemon :app:assembleDebug)
          "$ANDROID_HOME"/build-tools/36.0.0/aapt dump badging android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.travelbudget.app'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionName='10.5.397'" "$RUNNER_TEMP/apk-badging.txt"
      - name: Start a clean emulator, block egress, and capture
        id: capture
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          img='system-images;android-35;google_apis;x86_64'
          "$sdk" --install emulator platform-tools "$img"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/tb-play-avd"
          export ANDROID_USER_HOME="$RUNNER_TEMP/tb-play-android-user"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          "${sdk%/*}/avdmanager" create avd --force -n isolated_play -k "$img" -p "$ANDROID_AVD_HOME/isolated_play.avd" <<< no
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          config="$ANDROID_AVD_HOME/isolated_play.avd/config.ini"
          sed -i -E '/^hw\.lcd\.(width|height|density)[[:space:]]*=/d' "$config"
          printf '%s\n' hw.lcd.width=1080 hw.lcd.height=1920 hw.lcd.density=420 >> "$config"
          emulator -list-avds | grep -Fx isolated_play
          emulator -avd isolated_play -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -feature -Vulkan -memory 3072 -cores 2 -camera-front none -camera-back none -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emu=$!
          cleanup() {
            rc=$?
            trap - EXIT
            if (( rc != 0 )); then
              grep -Ev 'qemu.adb.pubkey|Sending adb public key' "$RUNNER_TEMP/emulator.log" | tail -45 || true
            fi
            timeout 8 adb -s emulator-5554 emu kill >/dev/null 2>&1 || kill "$emu" 2>/dev/null || true
            exit "$rc"
          }
          trap cleanup EXIT
          timeout 240 adb -s emulator-5554 wait-for-device || { tail -80 "$RUNNER_TEMP/emulator.log"; exit 1; }
          timeout 260 bash -c 'until adb -s emulator-5554 shell getprop sys.boot_completed | grep -q 1; do sleep 3; done'
          test "$(adb devices | awk '$2 == "device" {print $1}')" = emulator-5554
          echo "AVD boot completed: setting up isolated app capture"
          adb -s emulator-5554 root
          adb -s emulator-5554 wait-for-device
          test "$(adb -s emulator-5554 shell id -u | tr -d '\r')" = 0
          # Guest iptables affects only this ephemeral emulator. Preserve loopback and ADB.
          adb -s emulator-5554 shell iptables -w -I OUTPUT 1 '!' -o lo -j REJECT
          adb -s emulator-5554 shell ip6tables -w -I OUTPUT 1 '!' -o lo -j REJECT
          adb -s emulator-5554 shell iptables -w -C OUTPUT '!' -o lo -j REJECT
          adb -s emulator-5554 shell ip6tables -w -C OUTPUT '!' -o lo -j REJECT
          adb -s emulator-5554 shell wm size | grep -F '1080x1920'
          adb -s emulator-5554 shell wm density | grep -F '420'
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          adb -s emulator-5554 shell wm dismiss-keyguard
          adb -s emulator-5554 shell settings put system accelerometer_rotation 0
          adb -s emulator-5554 shell settings put system user_rotation 0
          adb -s emulator-5554 install android/app/build/outputs/apk/debug/app-debug.apk
          adb -s emulator-5554 shell pm grant com.travelbudget.app android.permission.POST_NOTIFICATIONS
          adb -s emulator-5554 logcat -c
          adb -s emulator-5554 shell am start -W -n com.travelbudget.app/com.travelbudget.app.MainActivity
          adb -s emulator-5554 shell dumpsys webviewupdate | grep -i 'Current WebView package' || true
          rc=0
          timeout --signal=TERM 288 node scripts/capture-play-screenshots.mjs || rc=$?
          out="$RUNNER_TEMP/travelbudget-play"
          mkdir -p "$out"
          cd "$out"
          shopt -s nullglob
          images=(screenshot-*.png)
          echo "raw_count=${#images[@]}" >> "$GITHUB_OUTPUT"
          if (( ${#images[@]} )); then
            raw="$RUNNER_TEMP/travelbudget-play-raw"
            mkdir -p "$raw"
            cp "${images[@]}" "$raw/"
            (cd "$raw"; sha256sum screenshot-*.png > sha256.txt)
            if test -f provenance.txt; then cp provenance.txt "$raw/"; fi
            for image in "${images[@]}"; do
              "$PLAY_IMAGE_PYTHON" -c '
          import sys
          from PIL import Image
          with Image.open(sys.argv[1]) as image:
              assert image.size == (1080,1920) and image.format == "PNG"
              image.convert("RGB").save(sys.argv[2], "PNG", optimize=True)
          with Image.open(sys.argv[2]) as image:
              assert image.mode == "RGB" and image.size == (1080,1920)
          ' "$image" "rgb-$image"
              mv "rgb-$image" "$image"
            done
            sha256sum "${images[@]}" > sha256.txt
            {
              echo 'TravelBudget 10.5.397 standard role, synthetic data, actual native Android surface.'
              echo 'Only screenshots captured after their individual content assertions are present.'
              echo "Verified screenshots: ${#images[@]}/4; capture exit status: $rc."
            } > run.txt
          fi
          echo "verified_count=${#images[@]}" >> "$GITHUB_OUTPUT"
          if (( rc != 0 )); then exit "$rc"; fi
          test "${#images[@]}" -ge 2
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always() && steps.capture.outputs.verified_count != '' && steps.capture.outputs.verified_count != '0'
        with:
          name: TravelBudget-10.5.397-Android-synthetic-portrait
          path: ${{ runner.temp }}/travelbudget-play/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always() && steps.capture.outputs.raw_count != '' && steps.capture.outputs.raw_count != '0' && steps.capture.outputs.verified_count == ''
        with:
          name: Verified-Android-raw-captures-requires-format-check
          path: ${{ runner.temp }}/travelbudget-play-raw/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure() && steps.capture.outputs.verified_count == '0'
        with:
          name: Android-emulator-diagnostic-NOT-A-PLAY-ASSET
          path: ${{ runner.temp }}/travelbudget-emulator-diagnostic/
          if-no-files-found: ignore
          retention-days: 3
