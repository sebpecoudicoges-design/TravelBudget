name: Offline and Analyse audit checks

on:
  push:
    branches: [codex/handoff-audit-2026-11-25-cloud]
    paths:
      - '.github/workflows/audit-continuation.yml'
      - 'config/module-size-budgets.json'
      - 'docs/generated/project-inventory.json'
      - 'public/legacy/js/00_offline_queue.js'
      - 'public/legacy/js/33_budget_analysis.js'
      - 'public/legacy/js/48_nutrition_ui.js'
      - 'src/data/mutationQueueStore.js'
      - 'src/data/nutrition*Repository.js'
      - 'src/features/analysis/**'
      - 'src/features/dashboard/**'
      - 'src/features/trip/**'
      - 'public/legacy/js/27_cashflow_curve.js'
      - 'public/legacy/js/29_trip_v1.js'
      - 'scripts/fixtures/connectedStartup.mjs'
      - 'scripts/audit-nutrition/**'
      - 'tests/e2e/financial-trip-budget.spec.js'
      - 'tests/e2e/document-preview-audit.spec.js'
      - 'tests/data/mutationQueue*.test.js'
      - 'tests/e2e/offline-queue-*.spec.js'
      - 'tests/data/nutrition*.test.js'
      - 'tests/e2e/nutrition-edit-storage.spec.js'
      - 'tests/features/analysis/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-continuation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: .ms-playwright
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test scripts/audit-nutrition/test-atomic-meal-client.mjs scripts/audit-nutrition/test-atomic-meal-conflict.mjs
      - run: npm test -- --maxWorkers=2
      - run: npm run docs:check
      - run: npm run build
      - run: npm run perf:budget
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/nutrition-edit-storage.spec.js --project=desktop-chromium
      - run: npm run test:e2e -- tests/e2e/financial-trip-budget.spec.js --project=desktop-chromium
      - run: npm run test:e2e -- tests/e2e/offline-queue-tabs.spec.js tests/e2e/offline-queue-revision.spec.js --project=desktop-chromium

      - run: npm run test:e2e -- tests/e2e/document-preview-audit.spec.js --project=desktop-chromium
