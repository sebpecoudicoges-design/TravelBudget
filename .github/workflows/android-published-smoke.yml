name: Published Android APK smoke

on:
  push:
    branches: [codex/handoff-audit-2026-11-25-cloud]
    paths:
      - '.github/workflows/android-published-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Fetch and fingerprint the released files
        shell: bash
        run: |
          set -euo pipefail
          base='https://obznbrzarhvmlbprcfie.supabase.co/storage/v1/object/public/app-downloads/apk'
          curl -fLsS --retry 2 --max-time 75 "$base/travelbudget-10.5.394-20261122-120000-debug.apk" -o "$RUNNER_TEMP/394.apk"
          curl -fLsS --retry 2 --max-time 75 "$base/travelbudget-10.5.395-20261123-090000-debug.apk" -o "$RUNNER_TEMP/395.apk"
          cd "$RUNNER_TEMP"
          printf '%s\n' \
            'b883890574f49e1df1bc5b19604461d46bc7cee8fb269cbb43f63aae3a8add98  394.apk' \
            'f294eca2f94db0d72ded36a388f290b54c14b15a84dcf1191830080a5efb498d  395.apk' | sha256sum -c -
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$signer"
          for apk in 394.apk 395.apk; do
            "$signer" verify --print-certs "$apk" | grep -Fi 'certificate SHA-256 digest: 9074406b0e5e64ee0d317c833494cc8a9872ead546cccef821604629e7da5ac0'
          done
      - name: Boot a fresh Android API 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          image='system-images;android-35;google_apis;x86_64'
          "$sdk" --install platform-tools "$image"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/tb-avd"
          export ANDROID_USER_HOME="$RUNNER_TEMP/tb-android-user"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          "$(dirname "$sdk")/avdmanager" create avd --force -n tb-audit-device -k "$image" -p "$ANDROID_AVD_HOME/tb-audit-device.avd" <<< no
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx tb-audit-device
          "$ANDROID_HOME/emulator/emulator" -avd tb-audit-device -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on >"$RUNNER_TEMP/android-audit-emulator.log" 2>&1 &
          timeout 240 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 wait-for-device || { tail -80 "$RUNNER_TEMP/android-audit-emulator.log"; exit 1; }
          for retry in $(seq 1 100); do
            if [ "$( "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          test "$( "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
      - name: Install the public upgrade and check offline launch
        shell: bash
        run: |
          set -euo pipefail
          pkg=com.travelbudget.app
          device() { "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 "$@"; }
          device shell cmd connectivity airplane-mode enable
          device shell svc wifi disable
          device shell svc data disable
          test "$(device shell settings get global airplane_mode_on | tr -d '\r')" = 1
          device install "$RUNNER_TEMP/394.apk" | grep -F Success
          device shell dumpsys package "$pkg" | grep -F 'versionName=10.5.394'
          device install -r "$RUNNER_TEMP/395.apk" | grep -F Success
          device shell dumpsys package "$pkg" > "$RUNNER_TEMP/tb-package.txt"
          grep -F 'versionName=10.5.395' "$RUNNER_TEMP/tb-package.txt"
          grep -F 'versionCode=10050395' "$RUNNER_TEMP/tb-package.txt"
          grep -F 'android.permission.POST_NOTIFICATIONS' "$RUNNER_TEMP/tb-package.txt"
          device shell cmd package resolve-activity --brief -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d "$pkg://auth-callback" -p "$pkg" | grep -F "$pkg/.MainActivity"
          device shell am start -W -n "$pkg/.MainActivity" | tee "$RUNNER_TEMP/tb-launch.txt"
          grep -F 'Status: ok' "$RUNNER_TEMP/tb-launch.txt"
          sleep 5
          device shell pidof "$pkg"
          echo 'PASS: official APK signature, in-place 10.5.394 → 10.5.395 upgrade, Android OAuth routing, declared notification permission and offline launch'
      - name: Stop the emulator
        if: always()
        run: '"$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true'
