name: F13 isolated integration

on:
  push:
    branches: [codex/handoff-audit-2026-11-25-cloud]
    paths:
      - '.github/workflows/f13-isolated.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'config/edge-check.lock'
      - 'scripts/*account-deletion*'
      - 'tests/core/personalDocumentUploadClient.test.js'
      - 'public/legacy/js/00_constants.js'
      - 'public/legacy/js/13_transactions_view.js'
      - 'public/legacy/js/29_trip_v1.js'
      - 'public/legacy/js/43_documents_ui.js'
      - 'supabase/functions/_shared/account-data.ts'
      - 'supabase/functions/process-account-deletions/**'
      - 'supabase/migrations/*account_deletion*'
      - 'supabase/migrations/*account_write_admission*'
      - 'supabase/functions/whatsapp-inbox/**'
      - 'supabase/functions/write-personal-document/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f13-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify the three client upload entry points
        run: npm test -- tests/core/personalDocumentUploadClient.test.js
      - name: Type-check the account lifecycle and fixture
        run: >-
          node node_modules/deno/bin.cjs check --no-config --lock=config/edge-check.lock --frozen=true
          supabase/functions/process-account-deletions/index.ts
          supabase/functions/request-account-deletion/index.ts
          supabase/functions/export-account-data/index.ts
          supabase/functions/whatsapp-inbox/index.ts
          supabase/functions/write-personal-document/index.ts
          scripts/check-account-deletion-supabase.ts
      - uses: supabase/setup-cli@v3
        with:
          version: '3.4.0'
      - name: Real Auth and Storage on a disposable local stack
        run: npm run test:supabase:account-deletion
