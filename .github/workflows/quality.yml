name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: .ms-playwright
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=desktop-chromium
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
  android-command:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- tests/scripts/androidCommand.test.js tests/ui/androidReleaseBundleContract.test.js
