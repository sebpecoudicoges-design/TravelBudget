name: Android unsigned DEX comparison

on:
  push:
    branches: [codex/handoff-audit-2026-11-25-cloud]
    paths:
      - '.github/workflows/android-dex-audit.yml'
      - 'scripts/android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dex-baseline:
    if: github.ref == 'refs/heads/codex/handoff-audit-2026-11-25-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The archived reference is the source used for the signed Play upload,
      # not the signed Play bundle itself. No production credentials are used.
      AUDIT_SOURCE_SHA: c3af4a40472e053b1cd008997f1974115a838fb8
      AUDIT_VERSION: 10.5.398
      AUDIT_VERSION_CODE: "10050398"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check the inventory tool
        run: python3 -B -m unittest discover -s scripts/android -v
      - name: Build the unsigned release bundles and emulator-only APKs
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$AUDIT_SOURCE_SHA"
          checkout="$RUNNER_TEMP/tb-dex-baseline"
          git worktree add --detach "$checkout" "$source_sha"
          cd "$checkout"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$(node -p "require('./package.json').version")" = "$AUDIT_VERSION"
          test ! -e android/app/google-services.json
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 missing}"
          export PATH="$JAVA_HOME/bin:$PATH"
          test -f "${ANDROID_HOME:?Android SDK missing}/platforms/android-36/android.jar"
          npm ci
          npm run build
          ./node_modules/.bin/cap sync android

          build_bundle() {
            (
              cd android
              env -u TB_ANDROID_KEYSTORE_PATH -u TB_ANDROID_KEYSTORE_PASSWORD \
                -u TB_ANDROID_KEY_ALIAS -u TB_ANDROID_KEY_PASSWORD \
                bash gradlew --no-daemon :app:bundleRelease :app:assembleRelease
            )
            local bundle
            bundle=$(find android/app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -type f)
            test -f "$bundle"
            mv "$bundle" "$1"
            local apk
            apk=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*-unsigned.apk' -type f)
            test -f "$apk"
            mv "$apk" "$2"
          }

          build_bundle "$RUNNER_TEMP/tb-$AUDIT_VERSION-unsigned.aab" "$RUNNER_TEMP/tb-baseline-unsigned.apk"
          python3 -B "$GITHUB_WORKSPACE/scripts/android/r8_experiment.py" configure android/app/build.gradle
          git diff --check -- android/app/build.gradle
          git diff -- android/app/build.gradle
          build_bundle "$RUNNER_TEMP/tb-$AUDIT_VERSION-r8-unsigned.aab" "$RUNNER_TEMP/tb-r8-unsigned.apk"
          mapping=android/app/build/outputs/mapping/release/mapping.txt
          test -s "$mapping"
          sha256sum "$mapping"
      - name: Compare uncompressed DEX and check mapping without uploading packages
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/tb-$AUDIT_VERSION-unsigned.aab"
          candidate="$RUNNER_TEMP/tb-$AUDIT_VERSION-r8-unsigned.aab"
          python3 -B scripts/android/dex_inventory.py "$baseline"
          python3 -B scripts/android/dex_inventory.py "$candidate"
          python3 -B scripts/android/r8_experiment.py compare "$baseline" "$candidate" | tee "$RUNNER_TEMP/tb-dex-comparison.json"
          {
            echo "### TravelBudget $AUDIT_VERSION unsigned R8 experiment (not Play binary)"
            echo 'DEX byte reduction is not a Play optimization score.'
            echo '```json'
            cat "$RUNNER_TEMP/tb-dex-comparison.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Analyze exact audit AABs with pinned Android CLI
        shell: bash
        run: |
          set -euo pipefail
          version=1.1.16919734
          url="https://dl.google.com/android/cli/$version/linux_x86_64"
          cli="$RUNNER_TEMP/tb-offline-analyzer"
          mkdir -p "$cli"
          cd "$cli"
          curl -fLsS --retry 2 --max-time 120 "$url/android-cli" -o android
          curl -fLsS --retry 2 --max-time 120 "$url/optimization_pack.zip" -o optimization.zip
          sha256sum -c <<'SUMS'
          9803784ddf24d4699929eece519ffa8b066afa9a2b93bd58749b3c6d2caaeeec  android
          343a972ec49e076630300618c3ffa18965ac76e33829bb53fcb727dc7d3ce697  optimization.zip
          SUMS
          chmod 700 android
          export HOME="$cli/home"
          pack="$HOME/.android/cli/packs/$version/optimization"
          mkdir -p "$pack"
          unzip -p optimization.zip optimization.jar > "$pack/optimization.jar"
          test -s "$pack/optimization.jar"
          test "$(./android --no-metrics --version)" = "$version"
          for suffix in unsigned r8-unsigned; do
            aab="$RUNNER_TEMP/tb-$AUDIT_VERSION-$suffix.aab"
            timeout 90 ./android --no-metrics analyze --analysis=optimization --format=json "$aab" > "$suffix.json"
            {
              echo "### Android CLI $version: audit bundle $suffix (not Play build)"
              echo '```json'
              python3 -B "$GITHUB_WORKSPACE/scripts/android/aab_optimization.py" "$aab" "$suffix.json"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Boot an isolated API 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          image='system-images;android-35;google_apis;x86_64'
          "$sdk" --install platform-tools "$image"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/tb-r8-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$(dirname "$sdk")/avdmanager" create avd --force -n tb-r8 -k "$image" <<< no
          "$ANDROID_HOME/emulator/emulator" -avd tb-r8 -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on >"$RUNNER_TEMP/tb-r8-emulator.log" 2>&1 &
          device() { "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 "$@"; }
          timeout 240 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 wait-for-device || { tail -80 "$RUNNER_TEMP/tb-r8-emulator.log"; exit 1; }
          for retry in $(seq 1 100); do
            if [ "$(device shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(device shell getprop sys.boot_completed | tr -d '\r')" = 1
          device shell cmd connectivity airplane-mode enable
          device shell svc wifi disable
          device shell svc data disable
          device shell input keyevent KEYCODE_WAKEUP
          device shell wm dismiss-keyguard
      - name: Verify cold offline startup and record main-process memory
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/tb-r8-ci-only.p12"
          keytool -genkeypair -keystore "$key" -storetype PKCS12 -storepass ephemeral-ci \
            -alias tb-ci -dname "CN=TravelBudget ephemeral emulator only" -keyalg RSA -keysize 2048 -validity 2
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$signer"
          for variant in baseline r8; do
            apk="$RUNNER_TEMP/tb-$variant-emulator.apk"
            "$signer" sign --ks "$key" --ks-pass pass:ephemeral-ci --ks-key-alias tb-ci \
              --out "$apk" "$RUNNER_TEMP/tb-$variant-unsigned.apk"
            "$signer" verify "$apk"
          done
          for sample in baseline:1 r8:1 r8:2 baseline:2 baseline:3 r8:3; do
            variant=${sample%:*}
            round=${sample#*:}
            bash scripts/android/r8_emulator_smoke.sh "$RUNNER_TEMP/tb-$variant-emulator.apk" "$variant" "$round" "$AUDIT_VERSION" "$AUDIT_VERSION_CODE"
          done
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell dumpsys webviewupdate | grep 'Current WebView package'
          python3 -B scripts/android/startup_memory.py summary "$RUNNER_TEMP/tb-startup-memory"  | tee "$RUNNER_TEMP/tb-startup-memory.json"
          {
            echo '### Offline startup memory, main process only (not Android vitals)'
            echo '```json'
            cat "$RUNNER_TEMP/tb-startup-memory.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop the emulator
        if: always()
        run: '"$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true'
