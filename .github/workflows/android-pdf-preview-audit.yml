name: Isolated Android PDF preview audit

on:
  push:
    branches: [codex/handoff-audit-2026-11-25-cloud]
    paths:
      - '.github/workflows/android-pdf-preview-audit.yml'
      - 'scripts/audit-android-pdf/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-pdf:
    if: github.ref == 'refs/heads/codex/handoff-audit-2026-11-25-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify the synthetic HTTPS transport contract
        run: node --test scripts/audit-android-pdf/test-pdf-preview-https.mjs
      - name: Build an emulator-only Capacitor shell with a synthetic HTTPS PDF
        shell: bash
        run: |
          set -euo pipefail
          source_sha=6a66c81aaa50317cb8b6b5be0b37f772ac08cd8d
          checkout="$RUNNER_TEMP/tb-pdf-fixture"
          git worktree add --detach "$checkout" "$source_sha"
          cd "$checkout"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test ! -e android/app/google-services.json
          npm ci
          node "$GITHUB_WORKSPACE/scripts/audit-android-pdf/pdf_preview_fixture.mjs" src/features/documents/documentView.js dist https
          fixture="$RUNNER_TEMP/tb-pdf-https"
          mkdir -m 700 "$fixture"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=TravelBudget PDF Fixture' \
            -addext subjectAltName=IP:127.0.0.1 -keyout "$fixture/fixture.key" -out "$fixture/fixture.crt"
          cp dist/audit-document.pdf "$fixture/audit-document.pdf"
          # Only the disposable local audit app trusts this one certificate.
          mkdir -p android/app/src/debug/res/{raw,xml}
          cp "$fixture/fixture.crt" android/app/src/debug/res/raw/audit_pdf_fixture.crt
          cat > android/app/src/debug/res/xml/audit_pdf_network.xml <<'XML'
          <network-security-config>
            <domain-config cleartextTrafficPermitted="false">
              <domain>127.0.0.1</domain>
              <trust-anchors><certificates src="@raw/audit_pdf_fixture" /></trust-anchors>
            </domain-config>
          </network-security-config>
          XML
          test ! -e android/app/src/debug/AndroidManifest.xml
          cat > android/app/src/debug/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:networkSecurityConfig="@xml/audit_pdf_network" />
          </manifest>
          XML
          sed -i 's/variant.applicationId.set("com.travelbudget.app")/variant.applicationId.set("org.travelbudget.audit.pdf")/' android/app/build.gradle
          grep -F 'variant.applicationId.set("org.travelbudget.audit.pdf")' android/app/build.gradle
          ./node_modules/.bin/cap sync android
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 missing}"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd android
          env -u TB_ANDROID_KEYSTORE_PATH -u TB_ANDROID_KEYSTORE_PASSWORD \
            -u TB_ANDROID_KEY_ALIAS -u TB_ANDROID_KEY_PASSWORD \
            bash gradlew --no-daemon :app:assembleDebug
          apk="$PWD/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/tb-pdf-badging.txt"
          grep -F "package: name='org.travelbudget.audit.pdf'" "$RUNNER_TEMP/tb-pdf-badging.txt"
          cp "$apk" "$RUNNER_TEMP/tb-pdf-debug.apk"
      - name: Boot an isolated offline API 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          sdk=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          image='system-images;android-35;google_apis;x86_64'
          "$sdk" --install platform-tools "$image"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/tb-pdf-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$(dirname "$sdk")/avdmanager" create avd --force -n tb-pdf -k "$image" <<< no
          "$ANDROID_HOME/emulator/emulator" -avd tb-pdf -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on >"$RUNNER_TEMP/tb-pdf-emulator.log" 2>&1 &
          device() { "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 "$@"; }
          timeout 240 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 wait-for-device || { tail -80 "$RUNNER_TEMP/tb-pdf-emulator.log"; exit 1; }
          for retry in $(seq 1 100); do
            if [ "$(device shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(device shell getprop sys.boot_completed | tr -d '\r')" = 1
          device shell cmd connectivity airplane-mode enable
          device shell svc wifi disable
          device shell svc data disable
          device shell input keyevent KEYCODE_WAKEUP
          device shell wm dismiss-keyguard
      - name: Observe the HTTPS iframe and tap the existing fallback link
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/tb-pdf-https"
          evidence="$RUNNER_TEMP/tb-pdf-evidence"
          mkdir -p "$evidence"
          export TB_PDF_FIXTURE_LOG="$evidence/fixture-requests.txt"
          device() { "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 "$@"; }
          node scripts/audit-android-pdf/pdf_preview_https.mjs \
            "$fixture/fixture.crt" "$fixture/fixture.key" "$fixture/audit-document.pdf" >>"$TB_PDF_FIXTURE_LOG" 2>&1 &
          pid=$!
          trap 'device reverse --remove tcp:8443 || true; kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            grep -Fq 'loopback PDF fixture ready' "$TB_PDF_FIXTURE_LOG" && break
            sleep .25
          done
          url='https://127.0.0.1:8443/audit-document.pdf?token=fixture-only'
          curl --noproxy '*' --max-time 5 --fail --silent --show-error --cacert "$fixture/fixture.crt" \
            "$url" -o "$fixture/host-check.pdf"
          cmp "$fixture/audit-document.pdf" "$fixture/host-check.pdf"
          printf '\n--- emulator WebView launch ---\n' >>"$TB_PDF_FIXTURE_LOG"
          device reverse tcp:8443 tcp:8443
          bash scripts/audit-android-pdf/pdf_preview_emulator.sh "$RUNNER_TEMP/tb-pdf-debug.apk" "$evidence"
          awk '/emulator WebView launch/{emulator=1} emulator && /"mode":"inline","method":"GET","status":20[06]/{got=1} END{exit !got}' "$TB_PDF_FIXTURE_LOG"
      - name: Retain only synthetic screenshots and diagnostics for review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-pdf-fixture-evidence
          path: ${{ runner.temp }}/tb-pdf-evidence/
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop the emulator
        if: always()
        run: '"$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true'
