import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def packageData = new JsonSlurper().parseText(file("../../package.json").getText("UTF-8"))
def appVersionName = packageData.version.toString()
def appVersionParts = appVersionName.tokenize(".").collect { it as int }
if (appVersionParts.size() != 3) {
    throw new GradleException("Version package.json invalide: ${appVersionName}")
}
def appVersionCode = appVersionParts[0] * 1000000 + appVersionParts[1] * 10000 + appVersionParts[2]
def releaseKeystorePath = System.getenv("TB_ANDROID_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("TB_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("TB_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("TB_ANDROID_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword
// Keep the release baseline unchanged unless the optimized candidate is requested.
def enableReleaseR8 = providers.gradleProperty("tbEnableR8").orNull == "true"

android {
    namespace = "com.travelbudget.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fr.pecloud.travelbudget"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled enableReleaseR8
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile(enableReleaseR8 ? 'proguard-android-optimize.txt' : 'proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType("debug")) { variant ->
        // Preserve direct-update compatibility with the existing test APK.
        variant.applicationId.set("com.travelbudget.app")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
