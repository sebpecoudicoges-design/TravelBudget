[build]
  command = "npm ci && node scripts/ensure-build-history.mjs && npm run audit:dependencies && npm run quality"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  NETLIFY_SKIP_INSTALL = "true"

[[redirects]]
  from = "/mcp"
  to = "https://obznbrzarhvmlbprcfie.supabase.co/functions/v1/travelbudget-mcp/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/mcp-auth/*"
  to = "https://obznbrzarhvmlbprcfie.supabase.co/functions/v1/travelbudget-mcp/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server/mcp-auth"
  to = "https://obznbrzarhvmlbprcfie.supabase.co/functions/v1/travelbudget-mcp/.well-known/oauth-authorization-server"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource/mcp"
  to = "https://obznbrzarhvmlbprcfie.supabase.co/functions/v1/travelbudget-mcp/.well-known/oauth-protected-resource"
  status = 200
  force = true

[[headers]]
  for = "/connect-chatgpt.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://obznbrzarhvmlbprcfie.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "https://obznbrzarhvmlbprcfie.supabase.co/functions/v1/travelbudget-mcp/.well-known/oauth-authorization-server"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "https://obznbrzarhvmlbprcfie.supabase.co/functions/v1/travelbudget-mcp/.well-known/oauth-protected-resource"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; frame-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://*.googleapis.com https://oauth2.googleapis.com https://api.frankfurter.dev https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:"

[[headers]]
  for = "/legacy/js/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/legacy/css/*"
  [headers.values]
    Cache-Control = "no-store"


[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
